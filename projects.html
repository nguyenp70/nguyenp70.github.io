<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phillip Nguyen | Personal Work</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-light: #112240;
            --accent: #64ffda;
            --text-main: #e6f1ff;
            --text-dim: #8892b0;
            --border: #233554;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 1.5rem 4rem;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-links a { color: var(--text-main); text-decoration: none; margin-right: 2rem; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent); }
        .nav-links a.active { color: var(--accent); }

        main { max-width: 1000px; margin: 4rem auto; padding: 0 2rem; flex: 1; }
        
        section { margin-bottom: 6rem; }
        
        .section-header { display: flex; align-items: center; margin-bottom: 3rem; }
        .section-header h2 { font-size: 1.8rem; margin-right: 1rem; color: #ccd6f6; }
        .section-header .line { height: 1px; flex-grow: 1; background: var(--border); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { 
            background: var(--bg-light); 
            border: 1px solid var(--border); 
            padding: 2rem; 
            border-radius: 4px; 
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card h4 { color: var(--accent); margin: 0 0 1rem; font-size: 0.8rem; text-transform: uppercase; }
        .card h3 { color: #ccd6f6; margin: 0 0 1rem; font-size: 1.3rem; }
        .card p { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 1.5rem 0; line-height: 1.5; flex-grow: 1; }

        .tag-list { display: flex; flex-wrap: wrap; margin-top: auto; }
        .tag { color: var(--accent); font-size: 0.75rem; margin-right: 1rem; margin-bottom: 0.5rem; }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .back-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        footer { text-align: center; padding: 4rem; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: auto; }
        
        @media (max-width: 768px) {
            nav { padding: 1.5rem 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html#me">01. Me</a>
            <a href="index.html#education">02. Education</a>
            <a href="experience.html">03. Experience</a>
            <a href="projects.html" class="active">04. Personal Work</a>
        </div>
    </nav>

    <main>
        <section id="projects">
            <div class="section-header">
                <h2>04. Personal Work</h2>
                <div class="line"></div>
            </div>
            <div class="grid">
                <!-- Project 1 -->
                <a href="project-learning-ai.html" style="text-decoration: none; color: inherit; display: block;">
                    <div class="card" style="height: 100%; box-sizing: border-box;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem;">
                            <h4 style="margin: 0;">AI & Research</h4>
                            <span style="color: var(--text-dim); font-size: 0.8rem; font-family: monospace;">06/19/2026</span>
                        </div>
                        <h3 style="margin-top: 0;">Harnessing AI</h3>
                        <p>My experience with learning how to use AI and what I've picked up (so far)</p>
                        <div class="tag-list">
                            <span class="tag">Gemini</span>
                            <span class="tag">Claude</span>
                            <span class="tag">Prompt Engineering</span>
                        </div>
                    </div>
                </a>
            </div>
            
            <div class="footer-nav">
                <a href="index.html" class="back-link">&larr; Back to Home</a>
            </div>
        </section>
    </main>

    <footer>
        Built & Secured by Phillip Nguyen &copy; 2026
    </footer>
</body>
</html>
