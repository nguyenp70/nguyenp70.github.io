<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phillip Nguyen | Learning to Harness AI</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-light: #112240;
            --accent: #64ffda;
            --text-main: #e6f1ff;
            --text-dim: #8892b0;
            --border: #233554;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'SF Mono', 'Fira Code', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 1.5rem 4rem;
            border-bottom: 1px solid var(--border);
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-links a { color: var(--text-main); text-decoration: none; margin-right: 2rem; font-size: 0.9rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent); }

        main { max-width: 800px; margin: 4rem auto; padding: 0 2rem; flex: 1; width: 100%; box-sizing: border-box; }
        
        h1 {
            color: #ccd6f6;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        .content {
            color: var(--text-main);
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 4rem;
        }

        .content p {
            margin-bottom: 1.5rem;
        }

        .tag-list { 
            display: flex; 
            flex-wrap: wrap; 
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .tag { color: var(--accent); font-size: 0.85rem; margin-right: 1rem; margin-bottom: 0.5rem; }

        .footer-nav {
            margin-top: 3rem;
        }

        .back-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
        }

        .back-link:hover {
            color: var(--accent);
        }

        footer { text-align: center; padding: 4rem; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: auto; }
        
        @media (max-width: 768px) {
            nav { padding: 1.5rem 2rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html#me">01. Me</a>
            <a href="index.html#education">02. Education</a>
            <a href="experience.html">03. Experience</a>
            <a href="projects.html">04. Personal Work</a>
        </div>
    </nav>

    <main>
        <section>
            <h1>Learning to Harness AI</h1>
            
            <div style="color: var(--accent); font-size: 1rem; margin-bottom: 3rem; font-family: monospace;">
                <span>Published: 06/19/2026</span>
            </div>
            
            <div class="content">
                <p>My experience with learning AI and what I've picked up (so far)</p>
            </div>

            <div class="tag-list">
                <span class="tag">Gemini</span>
                <span class="tag">Claude</span>
                <span class="tag">Prompt Engineering</span>
            </div>
            
            <div class="footer-nav">
                <a href="projects.html" class="back-link">&larr; Back to Personal Work</a>
            </div>
        </section>
    </main>

    <footer>
        Built & Secured by Phillip Nguyen &copy; 2026
    </footer>
</body>
</html>
